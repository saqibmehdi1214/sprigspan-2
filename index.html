<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprigSpan - Landscaping Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2e7d32; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .loading { text-align: center; font-size: 18px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SprigSpan Dashboard</h1>
        <p style="text-align: center;">Landscaping Business Management Tool</p>
        
        <div id="loading" class="loading">Loading your jobs data...</div>
        
        <table id="jobsTable" style="display: none;">
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Address</th>
                    <th>Scheduled Date</th>
                    <th>Crew</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="jobsList"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
